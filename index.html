<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Haber Takip</title>
  <link rel="alternate" type="application/rss+xml" title="YouTube Haber Takip" href="feed.xml">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --card: #1a1d24;
      --text: #eef0f3;
      --muted: #9aa3b2;
      --accent: #ff4d4d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 32px 20px 16px;
      max-width: 780px;
      margin: 0 auto;
    }
    header h1 {
      margin: 0 0 6px;
      font-size: 1.6rem;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    header a.feed-link {
      display: inline-block;
      margin-top: 10px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
      border: 1px solid var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
    }
    main {
      max-width: 780px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }
    ul.videos {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    li.video {
      background: var(--card);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    li.video .channel {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--accent);
      font-weight: 600;
    }
    li.video .title {
      color: var(--text);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
    }
    li.video .title:hover {
      text-decoration: underline;
    }
    li.video .date {
      color: var(--muted);
      font-size: 0.78rem;
    }
    li.empty {
      color: var(--muted);
      text-align: center;
      padding: 20px;
    }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
      padding: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>YouTube Haber Takip</h1>
    <p>Takip edilen YouTube haber kanallarındaki yeni videolar · Son güncelleme: 2026-08-19 11:07 UTC</p>
    <a class="feed-link" href="feed.xml">RSS feed: feed.xml</a>
  </header>
  <main>
    <ul class="videos">
      <li class="empty">Henüz video bulunamadı.</li>
    </ul>
  </main>
  <footer>
    Her 5 dakikada bir GitHub Actions ile otomatik güncellenir.
  </footer>
</body>
</html>
